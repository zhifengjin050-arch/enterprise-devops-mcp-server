# ------------------------------------------------------------
# Enterprise DevOps MCP Server - Docker Compose
# ------------------------------------------------------------
# Production (default):
#   docker compose up -d
#
# Testing profile:
#   docker compose --profile testing run --rm mcp-server-test
# ------------------------------------------------------------

services:
  # ---- Production MCP Server ----
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: enterprise-devops-mcp-server
    # stdio MCP 不提供 HTTP；不要占用 8000（与项目 1/3 后端冲突）
    # 若自行加了 HTTP 包装，再取消下面注释：
    # ports:
    #   - "8000:8000"
    environment:
      - MCP_SERVER_NAME=Enterprise DevOps MCP Server
      - MCP_SERVER_VERSION=1.0.1
      - ENABLE_SECURITY=true
      - EXECUTE_TOOLS_ENABLED=false
      - AUDIT_LOG_ENABLED=true
      - LOG_LEVEL=INFO
    volumes:
      # Linux/macOS Docker engine access (optional)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Optional: mount your own .env (do not commit real secrets)
      # - ./.env:/app/.env:ro
      # Optional: kubeconfig / SSH keys
      # - ~/.kube/config:/root/.kube/config:ro
      # - ~/.ssh:/root/.ssh:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from app.config import settings; assert settings.mcp_server_name"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - devops-network

  # ---- Testing profile ----
  mcp-server-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing
    container_name: enterprise-devops-mcp-server-test
    environment:
      - ENABLE_SECURITY=true
      - EXECUTE_TOOLS_ENABLED=false
      - AUDIT_LOG_ENABLED=true
      - LOG_LEVEL=WARNING
      - ALLOWED_TOOLS=system,docker,kubernetes,ssh
    profiles:
      - testing
    command: ["python", "-m", "pytest", "tests/", "-v"]

networks:
  devops-network:
    driver: bridge
